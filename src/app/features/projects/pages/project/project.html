<div class="project-page-wrapper">
  <div class="page-title">
    <app-route-back></app-route-back>
    <h2>Project</h2>
  </div>
  <div class="project-wrapper">
    @if (project(); as project) {
      <app-project-component [project]="project"></app-project-component>
    }
    <div class="tasks-container">
      <div class="tasks-wrapper" cdkDropListGroup>
        @for (status of taskStatus; track status) {
          <div
            class="task-wrapper"
            cdkDropList
            id="{{ status.replace(' ', '-') }}"
            [cdkDropListData]="tasks()"
            (cdkDropListDropped)="drop($event)"
          >
            <div class="task-status-wrapper">
              <h4 id="status">{{ status.toUpperCase() }}</h4>
              <app-create-task
                [status]="status"
                [currentProject]="project()"
              ></app-create-task>
            </div>
            <div class="tasks">
              @for (task of tasks(); track task.id) {
                @if (task.status === status) {
                  <div class="task">
                    <app-tasks [task]="task"></app-tasks>
                  </div>
                }
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
