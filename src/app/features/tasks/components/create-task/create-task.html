<button (click)="openCreateTask()">+ Task</button>

@if (taskCreation()) {
  <div class="task-creation overlay">
    <div class="task-creation-wrapper">
      <h2>Create a task</h2>
      @if (status()) {
        <p>{{ status() }}</p>
        <form
          #taskCreation="ngForm"
          (ngSubmit)="createTask(taskCreation,status()!)"
        >
          <label for="taskName">Task:</label>
          <input required type="text" name="name" id="taskName" ngModel />
          <label for="description">Description:</label>
          <input
            required
            type="text"
            name="description"
            id="description"
            ngModel
          />
          <label for="members">Add Members</label>
          <input type="text" name="members" id="members" ngModel />
          <label for="deadline">Deadline</label>
          <input required type="date" name="deadline" id="deadline" ngModel />
          <button type="submit">Create Task</button>
        </form>
      } @else {
        <form #taskCreation="ngForm" (ngSubmit)="createTask(taskCreation)">
          <label for="taskName">Task:</label>
          <input required type="text" name="task" id="taskName" ngModel />
          <label for="description">Description:</label>
          <input
            required
            type="text"
            name="description"
            id="description"
            ngModel
          />
          <label for="members">Add Members</label>
          <input type="text" name="members" id="members" ngModel />
          <label for="status">Status</label>
          <select name="status" ngModel>
            <option value="open">Open</option>
            <option value="in progress">In Progress</option>
            <option value="assigned">Assigned</option>
          </select>
          <label for="deadline">Deadline</label>
          <input required type="date" name="deadline" id="deadline" ngModel />
          <button type="submit">Create Task</button>
        </form>
      }
    </div>
  </div>
}
