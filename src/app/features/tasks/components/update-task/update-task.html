<div class="overlay">
  <div class="update-wrapper" (click)="$event.stopPropagation()">
    <div class="change-heading">
      <button type="button" (click)="closeChangeMenu.emit()" class="btn-hollow">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <h3>Edit: {{ currentTask()?.title }}</h3>
    </div>
    <form
      id="updateTask"
      #updateTask="ngForm"
      (ngSubmit)="taskUpdating(updateTask, currentTask()?.id)"
    >
      <div class="input-wrapper">
        <label for="taskName">Task:</label>
        <input
          required
          type="text"
          name="title"
          id="taskName"
          [ngModel]="currentTask()?.title"
          ;
        />
      </div>
      <div class="input-wrapper">
        <label for="description">Description:</label>
        <input
          required
          type="text"
          name="description"
          id="description"
          [ngModel]="currentTask()?.description"
          ;
        />
      </div>
      <!-- replace with a dropdown with autocomplete  -->
      <div class="input-wrapper">
        <label for="members">Add Members</label>
        <select name="members" multiple [(ngModel)]="selectedMemberIds">
          @for (member of taskMembers(); track member.id) {
              <option [ngValue]="member">
                {{ member.firstName }} {{ member.lastName }}
              </option>
          }
        </select>
      </div>
      <div class="input-wrapper">
        <label for="status">Status</label>
        <select name="status" [ngModel]="currentTask()?.status">
          @for (status of tasksStatus; track status) {
            @if (status === currentTask()?.status) {
              <option [value]="status" selected>
                {{ status.toUpperCase() }}
              </option>
            } @else {
              <option [value]="status">{{ status.toUpperCase() }}</option>
            }
          }
        </select>
      </div>
      <div class="input-wrapper">
        <label for="deadline">Deadline</label>
        <input
          required
          type="date"
          name="deadline"
          id="deadline"
          [ngModel]="currentTask()?.deadline"
        />
      </div>
      @if (noChanges()) {
        <p>No changes made to the task</p>
      }
      <div class="btn-wrapper">
        <button type="submit" class="btn-fill">Update</button>
      </div>
    </form>
  </div>
</div>
