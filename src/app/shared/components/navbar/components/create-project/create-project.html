<div class="project-creation overlay">
    <div class="project-creation-wrapper">
      <h2>Create a project</h2>
      <form #projectCreation="ngForm" (ngSubmit)="createProject(projectCreation)">
        <label for="projectName">Projectname:</label>
        <input required type="text" name="projectName" id="projectName" ngModel>
        <label for="description">Description:</label>
        <input required type="text" name="description" id="description" ngModel>
        <label for="status">Status</label>
        <input type="text" name="status" id="status" ngModel>
        <label for="addMembers">Add Members</label>
        <input type="text" name="addMembers" id="addMembers" ngModel>
        <label for="deadline">Deadline</label>
        <!-- maybe add current date as base value -->
        <input required type="date" name="deadline" id="deadline" ngModel>
        <button type="submit">Create Project</button>
      </form>
    </div>
</div>
